name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: make test

  deb:
    # Build inside Debian 13 (trixie), the target of Privux, not the runner's Ubuntu.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools lintian ca-certificates
      - uses: actions/checkout@v4
      - name: Build packages
        run: dpkg-buildpackage -us -uc -b
      - name: Lint (informational for now)
        run: lintian --info ../*.changes || true
      - name: Collect packages
        run: mkdir -p out && cp ../*.deb out/
      - uses: actions/upload-artifact@v4
        with:
          name: privux-deb
          path: out/*.deb
