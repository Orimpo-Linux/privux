name: Build Privux Cyber Complete Alpha 0.1
on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-iso-builder
      - feature/privux-desktop-cyber-beta
      - feature/privux-cyber-complete-alpha-0.1
    paths:
      - "iso/**"
      - "scripts/build-live-iso.sh"
      - "src/privux/**"
      - ".github/workflows/live-iso.yml"
permissions:
  contents: read
jobs:
  live-iso:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools rsync ca-certificates
      - name: Check package availability
        run: |
          apt-get update
          awk 'NF && $1 !~ /^#/' iso/config/package-lists/privux.list.chroot | while read -r package; do
            apt-cache show "$package" >/dev/null || { echo "Unavailable package: $package" >&2; exit 1; }
          done
      - name: Build ISO
        run: bash scripts/build-live-iso.sh
      - name: Check ISO
        run: |
          ls -lh build/live/*.iso
          test "$(find build/live -maxdepth 1 -name '*.iso' -type f | wc -l)" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: privux-cyber-complete-alpha-0.1-amd64
          path: build/live/*.iso
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
